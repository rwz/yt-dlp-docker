name: checks
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - shell/**
      - test/**
      - .github/workflows/checks.yml
  pull_request:
    paths:
      - Dockerfile
      - shell/**
      - test/**
      - .github/workflows/checks.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0

      - name: Script tests
        run: bash test/script_test.sh

  # Runs here rather than in build.yml: the reproducibility of the apt layer can only be
  # broken by a Dockerfile edit, so gate it on the change instead of paying two apt
  # installs on every daily rebuild.
  layer-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - name: Runtime apt layer is reproducible
        run: bash test/layer_stability.sh
